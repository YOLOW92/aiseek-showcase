<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d"><title id="t">Evidence classification</title><desc id="d">An original schematic explaining that claim labels are decided by provenance and explicit rules rather than language model confidence.</desc><rect width="1200" height="460" rx="20" fill="#0E2031"/><g font-family="Arial,sans-serif"><text x="48" y="62" fill="#F1FAFF" font-size="28" font-weight="700">Evidence before certainty.</text><text x="48" y="95" fill="#A8C9D3" font-size="16">Models can propose. Deterministic policy decides what readers may see.</text></g>
